; cPanel usa .user.ini para los límites del PHP.
; Filament con 90 días de historial y Livewire en la pantalla de cocina con
; polling de 2s necesitan más memoria que el 128M por defecto de XAMPP.
memory_limit = 256M

max_execution_time = 120
max_input_vars = 5000

opcache.enable = 1
opcache.revalidate_freq = 0